# OWASP ZAP baseline scan against the compose stack. Non-blocking at first (fail_action: false).
# Run:  docker compose up -d
#       docker run --rm --network host -v "$PWD/scripts/security:/zap/wrk" \
#         ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:3000 -c zap-baseline.yml
# Or wire into CI with zaproxy/action-baseline (pin by SHA) once the stack is healthy.
target: http://127.0.0.1:3000
fail_action: false
rules:
  # Next.js inline scripts: CSP rollout is Report-Only first (see Documents/DevOps/security-checklist.md)
  10055: WARN
