name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r VENUAI/requirements.txt
      - name: Run backend test suite
        env:
          GROQ_API_KEY: ci-placeholder-not-a-real-key
          GROQ_MODEL: openai/gpt-oss-120b
          JWT_SECRET_KEY: ci-only-secret-never-used-outside-ci-runners
        run: pytest VENUAI/tests/ -v

  evals:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JWT_SECRET_KEY: ci-only-secret-never-used-outside-ci-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r VENUAI/requirements.txt
      - name: Eval metric/harness unit tests (deterministic, no network)
        run: pytest VENUAI/tests/test_eval_harness.py VENUAI/tests/test_retrieval_metrics.py -q
      - name: Live eval (only when GROQ_API_KEY secret exists)
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret not set - skipping live eval"
          else
            python -m VENUAI.evals.eval_runner run --limit 10 --judge --gate --out-dir eval-out
          fi
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-out
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chat-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: chat-app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        # continue-on-error: this codebase has pre-existing lint debt (unrelated
        # to auth work done in this pass) — tracked in Documents/future-additions.md,
        # not silently hidden. Flip to blocking once that debt is paid down.
        run: npm run lint
        continue-on-error: true
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
