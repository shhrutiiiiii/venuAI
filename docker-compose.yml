services:
  backend:
    build:
      context: .
      dockerfile: VENUAI/Dockerfile
    env_file:
      - VENUAI/.env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/VENUAI/chroma_db
      - uploaded_docs:/app/VENUAI/uploaded_docs
      - app_data:/app/VENUAI/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./chat-app
      dockerfile: Dockerfile
    environment:
      - RAG_SERVER_URL=http://backend:8000
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Real PostgreSQL backend for the knowledge graph (Documents/AI/knowledge-graph.md).
  # Opt-in via the "postgres" Compose profile — SQLite remains the
  # zero-config default; this service only starts when explicitly
  # requested: `docker compose --profile postgres up`. Also set
  # KNOWLEDGE_GRAPH_BACKEND=postgres (and point PGHOST at this service's
  # name, "postgres") in VENUAI/.env for the backend to actually use it.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=venuai_graph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
  uploaded_docs:
  app_data:
  postgres_data:
